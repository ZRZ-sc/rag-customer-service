# =============================================================================
# RAG 智能客服 —— 单一全栈编排（合并原 docker-compose.infra.yml + monitoring.yml）
#
# 常用方式：
#   docker compose up -d                                   # 全栈（中间件 + 应用 + Nginx + 监控）
#   docker compose up -d etcd minio milvus postgres redis  # 仅中间件（本机 venv 直跑应用时）
#   docker compose up -d prometheus grafana                # 仅监控栈
#   docker compose up -d --scale app=3                     # 应用多副本（需先外置模型推理，见 docs/production_plan.md）
#
# 访问入口：
#   Nginx（聊天界面/管理后台/API）  http://localhost:${NGINX_PORT:-8080}
#   Grafana                        http://localhost:3000   (admin / admin123)
#   Prometheus                     http://localhost:9090
# =============================================================================

services:
  # ---------------- 基础设施 ----------------
  etcd:
    container_name: rag-etcd
    image: quay.io/coreos/etcd:v3.5.14
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-./volumes}/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [rag-net]

  minio:
    container_name: rag-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-./volumes}/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [rag-net]

  milvus:
    container_name: rag-milvus
    image: milvusdb/milvus:v2.4.15
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-./volumes}/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_started
    networks: [rag-net]

  postgres:
    container_name: rag-postgres
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-rag}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-ragpass}
      POSTGRES_DB: ${PG_DATABASE:-rag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-rag} -d ${PG_DATABASE:-rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [rag-net]

  redis:
    container_name: rag-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-./volumes}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [rag-net]

  # ---------------- 应用 ----------------
  app:
    container_name: rag-app
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-customer-service:latest
    restart: unless-stopped
    # 模型不打进镜像（体积大、随知识库换代），通过卷挂载只读使用
    volumes:
      - ./models:/srv/models:ro
    env_file:
      - path: .env
        required: false      # 缺失时用下方 environment 的默认值
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
      EMBEDDING_MODEL: /srv/models/bge-small-zh-v1.5
      RERANK_MODEL: /srv/models/bge-reranker-base
      PRELOAD_MODELS: "false"          # 单副本 + 容器内存受限时按需懒加载
      PROMETHEUS_URL: http://prometheus:9090
      CACHE_WARMUP_ON_STARTUP: "false" # 需要开机预热高频问题时改为 true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    expose:
      - "8000"
    networks: [rag-net]

  nginx:
    container_name: rag-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [rag-net]

  # ---------------- 监控 ----------------
  prometheus:
    container_name: rag-prometheus
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    user: root
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - ./volumes/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      app:
        condition: service_started
    networks: [rag-net]

  grafana:
    container_name: rag-grafana
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rag-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./volumes/grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [rag-net]

networks:
  rag-net:
    driver: bridge

volumes:
  pgdata:
