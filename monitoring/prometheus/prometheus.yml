# Prometheus 配置：抓取 FastAPI /metrics（需求文档 3.6 节）
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: rag-local
    service: rag-customer-service

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # ---- 容器化部署（推荐）：应用在 compose 网络内，按服务名抓取 ----
  - job_name: rag-api-docker
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: rag-customer-service
          env: docker
  # 说明：本机 venv 直跑应用时（应用在 Windows 上），该目标会显示 down（DNS 解析不到 app），
  #       属预期现象；此时请看下方 rag-api 任务。

  # ---- 本机开发：应用跑在 Windows 宿主机上，抓取目标由脚本自动写入 ----
  # scripts/monitoring_up.ps1 会探测 WSL 默认网关 IP（= Windows 宿主机）并写入
  # targets/windows-host.json，Prometheus 通过 file_sd_configs 热加载，
  # 无需重启或改本文件。
  - job_name: rag-api
    metrics_path: /metrics
    scheme: http
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: job
        replacement: rag-api

  # ---- Prometheus 自身 ----
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
