# Nginx 反向代理 + 限流（与需求文档 3.1/3.5 的 Nginx 层对应）
#
# 职责：
#   1) 反向代理到应用（upstream 可水平扩展为多副本，见 docs/production_plan.md）
#   2) 入口限流：超限返回 429（与应用层错误码一致）
#   3) 静态资源缓存、gzip、请求 ID 透传、/metrics 内网白名单
worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # ---- 日志（JSON 结构，便于采集；与应用的 http_access 字段风格保持一致） ----
    log_format json_access escape=json
      '{"event":"nginx_access","ts":"$time_iso8601","client":"$remote_addr",'
      '"method":"$request_method","path":"$uri","status":$status,'
      '"duration_ms":$request_time,"bytes":$body_bytes_sent,'
      '"request_id":"$http_x_request_id","upstream_status":"$upstream_status",'
      '"user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_access;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/html;
    gzip_min_length 1024;

    # ---- 限流：按客户端 IP 令牌桶 ----
    # chat 接口（含 LLM 调用，成本高）：20 r/s + 突发 40
    limit_req_zone $binary_remote_addr zone=chat_zone:10m rate=20r/s;
    # 其余 API：60 r/s + 突发 120
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=60r/s;
    # 单 IP 并发连接数上限
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # ---- 上游：应用（多副本时在此列出全部实例，或用 DNS 轮询） ----
    upstream rag_app {
        server app:8000 max_fails=3 fail_timeout=15s;
        # 生产多副本示例（见 docs/production_plan.md）：
        # server app-1:8000 max_fails=3 fail_timeout=15s;
        # server app-2:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 1m;

        # 请求 ID：有则透传，无则由应用生成
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 问答接口：限流 + 较长超时（冷启动 RAG 可能数秒）
        location /api/v1/chat {
            limit_req  zone=chat_zone burst=40 nodelay;
            limit_conn conn_zone 64;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
            proxy_pass http://rag_app;
        }

        # 其余业务接口
        location /api/ {
            limit_req  zone=api_zone burst=120 nodelay;
            limit_conn conn_zone 128;
            proxy_read_timeout 60s;
            proxy_pass http://rag_app;
        }

        # 静态页面（聊天界面 / 管理后台）：短缓存
        location /static/ {
            proxy_pass http://rag_app;
            expires 5m;
            add_header Cache-Control "public";
        }

        # 指标端点：仅内网（Prometheus 容器）可访问
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://rag_app;
        }

        # 探针
        location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

        # 默认：聊天界面 / 管理后台 / 文档
        location / {
            limit_req zone=api_zone burst=120 nodelay;
            proxy_pass http://rag_app;
        }
    }
}
