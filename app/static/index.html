<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>优选商城 · 智能客服</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--line:#e5e7eb;--text:#1f2328;--muted:#6b7280;
        --brand:#2563eb;--brand-soft:#eff6ff;--ok:#059669;--warn:#d97706;--err:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;
         display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  .spacer{flex:1}
  .meta{font-size:12px;color:var(--muted)}
  input,select,textarea,button{font:inherit}
  .token-input{width:200px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:12px}
  button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;
         padding:6px 12px;transition:.15s}
  button:hover{border-color:var(--brand);color:var(--brand)}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.primary:hover{opacity:.9;color:#fff}
  button:disabled{opacity:.5;cursor:not-allowed}
  main{flex:1;overflow-y:auto;padding:18px 16px;max-width:900px;width:100%;margin:0 auto}
  .row{display:flex;margin-bottom:14px}
  .row.user{justify-content:flex-end}
  .bubble{max-width:78%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
  .user .bubble{background:var(--brand);color:#fff;border-bottom-right-radius:4px}
  .bot .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
  .bot .bubble.error{border-color:var(--err);color:var(--err)}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--brand-soft);
         color:var(--brand);border:1px solid #dbeafe}
  .badge.db{background:#ecfdf5;color:var(--ok);border-color:#a7f3d0}
  .badge.rag{background:#eff6ff;color:var(--brand);border-color:#bfdbfe}
  .badge.fb{background:#fffbeb;color:var(--warn);border-color:#fde68a}
  .badge.plain{background:#f3f4f6;color:var(--muted);border-color:var(--line)}
  .acts{display:flex;gap:4px;margin-top:6px}
  .acts button{padding:2px 8px;font-size:13px;line-height:1.4}
  .acts button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
  details{margin-top:6px;font-size:12px;color:var(--muted)}
  details summary{cursor:pointer}
  ul.src{margin:6px 0 0;padding-left:18px;line-height:1.7}
  ul.src .score{color:var(--brand);font-variant-numeric:tabular-nums}
  ul.src .cat{background:#f3f4f6;border-radius:4px;padding:0 4px;font-size:11px}
  .examples{display:flex;gap:8px;flex-wrap:wrap;margin:0 auto 12px;max-width:900px;padding:0 16px}
  .examples button{font-size:12px;padding:4px 10px;color:var(--muted)}
  footer{border-top:1px solid var(--line);background:var(--card);padding:12px 16px}
  .composer{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;min-height:44px;max-height:140px;padding:10px 12px;
           border:1px solid var(--line);border-radius:12px;outline:none}
  textarea:focus{border-color:var(--brand)}
  .hint{max-width:900px;margin:6px auto 0;font-size:11px;color:var(--muted)}
  .typing span{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;
               background:var(--muted);animation:b 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
</style>
</head>
<body>
<header>
  <h1>🛍️ 优选商城 · 智能客服</h1>
  <span class="meta" id="sessionLabel"></span>
  <span class="spacer"></span>
  <input class="token-input" id="token" placeholder="API Token" title="Bearer Token">
  <button onclick="newSession()">新会话</button>
  <a href="/admin"><button>管理后台</button></a>
  <a href="/docs"><button>API 文档</button></a>
</header>

<div class="examples" id="examples"></div>

<main id="chat"></main>

<footer>
  <div class="composer">
    <textarea id="q" placeholder="请输入您的问题，例如：我的订单 ORD20240100001 到哪里了？"></textarea>
    <button class="primary" id="send" onclick="send()">发送</button>
  </div>
  <div class="hint">Enter 发送 ／ Shift+Enter 换行 ｜ 支持多轮追问（如"那什么时候能到？"）</div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get token(){ return localStorage.getItem('rag_token') || ''; },
  set token(v){ localStorage.setItem('rag_token', v); },
  get sid(){ return localStorage.getItem('rag_sid') || ''; },
  set sid(v){ localStorage.setItem('rag_sid', v); },
};
const EXAMPLES = [
  '我的订单 ORD20240100001 到哪里了？',
  '退货运费谁出？',
  '怎么申请退货？',
  '那什么时候能到？',
  '贵司的量子传送门保修几年',
];

function newSession(){
  store.sid = 'web-' + Math.random().toString(36).slice(2, 10);
  $('chat').innerHTML = '';
  renderSession();
  addBot('您好，我是优选商城智能客服，请问有什么可以帮您？', {source:'system'});
}
// FAQ 内容来自知识库，渲染前统一转义，避免 HTML 注入
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderSession(){ $('sessionLabel').textContent = '会话 ' + (store.sid || '-'); }

function addUser(text){
  const el = document.createElement('div');
  el.className = 'row user';
  el.innerHTML = `<div class="bubble"></div>`;
  el.querySelector('.bubble').textContent = text;
  $('chat').appendChild(el); scrollDown();
}
function addBot(text, meta = {}, requestId = null){
  const el = document.createElement('div');
  el.className = 'row bot';
  const b = document.createElement('div');
  b.className = 'bubble' + (meta.error ? ' error' : '');
  b.textContent = text;
  el.appendChild(b);

  if (meta.source && meta.source !== 'system'){
    const badges = document.createElement('div');
    badges.className = 'badges';
    const src = meta.source;
    const cls = src === 'database' ? 'db' : (src === 'rag' ? 'rag' : (src === 'fallback' ? 'fb' : 'plain'));
    const label = src === 'database' ? '📦 精确查询(数据库)' : src === 'rag' ? '📚 知识库(RAG)' :
                  src === 'fallback' ? '⚠️ 兜底/转人工' : src;
    badges.innerHTML =
      `<span class="badge ${cls}">${label}</span>` +
      (meta.intent ? `<span class="badge plain">意图 ${meta.intent}</span>` : '') +
      (meta.confidence != null ? `<span class="badge plain">置信度 ${Number(meta.confidence).toFixed(3)}</span>` : '') +
      (meta.latency_ms != null ? `<span class="badge plain">${meta.latency_ms} ms</span>` : '') +
      (meta.tokens_used ? `<span class="badge plain">${meta.tokens_used} tokens</span>` : '');
    b.appendChild(badges);

    if (meta.rewritten_question){
      const d = document.createElement('details');
      d.innerHTML = `<summary>查看上下文改写结果</summary>${meta.rewritten_question}`;
      b.appendChild(d);
    }
    if (Array.isArray(meta.sources) && meta.sources.length){
      const d = document.createElement('details');
      const items = meta.sources.map((s, i) =>
        `<li>${escapeHtml(s.question || s.faq_id || '-')}` +
        (s.score != null ? ` <span class="score">${Number(s.score).toFixed(3)}</span>` : '') +
        (s.category ? ` <span class="cat">${escapeHtml(s.category)}</span>` : '') + `</li>`).join('');
      d.innerHTML = `<summary>参考知识条目（${meta.sources.length}）</summary><ul class="src">${items}</ul>`;
      b.appendChild(d);
    }
    if (meta.handoff_ticket_id){
      const d = document.createElement('details');
      d.open = true;
      d.innerHTML = `<summary>已转人工</summary>工单号：${meta.handoff_ticket_id}`;
      b.appendChild(d);
    }
    if (requestId){
      const acts = document.createElement('div');
      acts.className = 'acts';
      acts.innerHTML = `<button onclick="feedback(this,'${requestId}',1)">👍 有帮助</button>
                        <button onclick="feedback(this,'${requestId}',-1)">👎 没帮助</button>`;
      b.appendChild(acts);
    }
  }
  $('chat').appendChild(el); scrollDown();
  return el;
}
function addTyping(){
  const el = document.createElement('div');
  el.className = 'row bot';
  el.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
  $('chat').appendChild(el); scrollDown();
  return el;
}
function scrollDown(){ const m = $('chat'); m.scrollTop = m.scrollHeight; }

async function send(){
  const box = $('q');
  const question = box.value.trim();
  if (!question) return;
  const token = $('token').value.trim();
  if (!token){ alert('请先在右上角填写 API Token'); return; }
  store.token = token;
  if (!store.sid) newSession();

  box.value = ''; box.style.height = 'auto';
  addUser(question);
  $('send').disabled = true;
  const typing = addTyping();

  try{
    const r = await fetch('/api/v1/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization': 'Bearer ' + token},
      body: JSON.stringify({session_id: store.sid, question, user_id: 'web_user'})
    });
    const body = await r.json();
    typing.remove();
    if (r.status !== 200 || body.code !== 0){
      addBot(`请求失败（HTTP ${r.status}）：${body.message || ''}`, {error: true});
    } else {
      addBot(body.data.answer, body.data, body.data.request_id);
    }
  } catch(e){
    typing.remove();
    addBot('网络异常：' + e.message, {error: true});
  } finally {
    $('send').disabled = false;
    box.focus();
  }
}

async function feedback(btn, requestId, value){
  const token = $('token').value.trim() || store.token;
  const parent = btn.parentElement;
  parent.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  try{
    const r = await fetch('/api/v1/feedback', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization': 'Bearer ' + token},
      body: JSON.stringify({request_id: requestId, feedback: value, user_id: 'web_user'})
    });
    const body = await r.json();
    if (r.status !== 200){ alert('反馈提交失败：' + (body.message || r.status)); btn.classList.remove('on'); }
  } catch(e){ alert('反馈提交失败：' + e.message); btn.classList.remove('on'); }
}

// 初始化
(function init(){
  $('token').value = store.token;
  $('token').addEventListener('change', () => store.token = $('token').value.trim());
  if (!store.sid) newSession(); else { renderSession(); addBot('欢迎回来，请继续提问。', {source:'system'}); }

  const wrap = $('examples');
  EXAMPLES.forEach(q => {
    const b = document.createElement('button');
    b.textContent = q;
    b.onclick = () => { $('q').value = q; send(); };
    wrap.appendChild(b);
  });

  const box = $('q');
  box.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });
  box.addEventListener('input', () => {
    box.style.height = 'auto';
    box.style.height = Math.min(box.scrollHeight, 140) + 'px';
  });
  box.focus();
})();
</script>
</body>
</html>
